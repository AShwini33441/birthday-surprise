<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birthday Surprise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="surprise-body">
  <main class="surprise-card">
    <h1>Happy Birthday My Love 💖</h1>
    <img id="surprisePhoto" alt="Birthday surprise image">
    <p id="surpriseMessage">Happy birthday, my love.💖</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const photo = params.get("photo");
    const message = params.get("message") || "Happy birthday, my love.💖";
    if (photo) document.getElementById("surprisePhoto").src = photo;
    document.getElementById("surpriseMessage").textContent = message;
  </script>
</body>
</html>
